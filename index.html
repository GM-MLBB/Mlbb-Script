*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  color:white;
  font-family:'Rajdhani', sans-serif;

/* ===== LOADING SCREEN CYBER ===== */
#loading{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#000;
  z-index:9999;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.loading-text{
  font-family:'Orbitron', sans-serif;
  font-size:18px;
  color:#00f0ff;
  letter-spacing:2px;
  text-shadow:0 0 20px #00f0ff;
  margin-bottom:20px;
  animation:blink 0.5s infinite;
}
@keyframes blink{50%{opacity:0.3}}

.loading-text.granted{
  color:#00ff00;
  text-shadow:0 0 20px #00ff00, 0 0 40px #00ff00;
  animation:granted 0.5s;
}
@keyframes granted{0%{transform:scale(0.5);filter:blur(10px)}100%{transform:scale(1);filter:blur(0)}}

.loading-bar{
  width:320px;
  height:5px;
  background:#111;
  border:1px solid #00f0ff;
  border-radius:10px;
  overflow:hidden;
}
.loading-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#ff0000,#ff6600,#00f0ff);
  animation:load 3s linear forwards;
  box-shadow:0 0 20px #00f0ff;
}
@keyframes load{to{width:100%}}

.scanline{
  position:absolute;
  width:100%;
  height:2px;
  background:#00f0ff;
  box-shadow:0 0 10px #00f0ff;
  animation:scan 2s linear infinite;
}
@keyframes scan{0%{top:0}100%{top:100%}}

#loading.fadeOut{animation:fadeOut 1s 1s forwards}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
/* ===== SELESAI LOADING ===== */

#matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1}

.content{animation:fadeIn 1s 4.5s forwards;opacity:0}
@keyframes fadeIn{to{opacity:1}}

.logo{
  width:110px;
  height:110px;
  margin:25px auto 15px;
  border-radius:50%;
  border:3px solid #ff0000;
  box-shadow:0 0 20px #ff0000, 0 0 40px #ff6600;
  animation:glow-logo 1.5s infinite alternate;
  object-fit:cover;
}
@keyframes glow-logo{0%{box-shadow:0 0 15px #ff0000}100%{box-shadow:0 0 35px #ff6600}}

h1{
  font-family:'Orbitron', sans-serif;
  font-size:24px;
  font-weight:900;
  color:#fff;
  text-shadow:0 0 10px #00f0ff;
  animation:lightning 2s infinite;
}
@keyframes lightning{
 0%,100%{text-shadow:0 0 10px #00f0ff}
 5%,15%{text-shadow:0 0 30px #fff, 0 0 60px #00f0ff, 0 0 90px #ff00c8}
 10%{text-shadow:none}
}

.subtitle{color:#aaa;font-size:12px;margin-bottom:25px;font-weight:600}

.btn-full{

  text-decoration:none;
  font-family:'Orbitron', sans-serif;

  font-weight:900;
  box-shadow:0 0 25px #ff0000aa;
  border:2px solid #ff6600;
  animation:fire 1.5s infinite, pulse 1.5s infinite;

@keyframes fire{0%{background-position:0%}100%{background-position:200%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

h2{

.btn{

.btn:hover{border-color:#ff0000;box-shadow:0 0 20px #ff0000;transform:translateY(-2px)}

</div>

<!-- MUSIK BACKGROUND -->

<!-- SUARA ACCESS GRANTED -->

<script>
// SCRIPT LOADING + SUARA
setTimeout(()=>{
  document.getElementById('loadText').innerText = "ACCESS GRANTED";
  document.getElementById('loadText').classList.add('granted');
  document.getElementById('grantedSound').play(); // SUARA NYALA DISINI
  document.getElementById('loading').classList.add('fadeOut');
},3000);

// AUTO PLAY BGM SETELAH KLIK
document.addEventListener('click', ()=>{
  document.getElementById('bgm').play();
})

// SCRIPT MATRIX
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars = "01MLBBSCRIPT";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];
for(let i=0;i<columns;i++) drops[i]=1;

function draw(){
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#00f0ff";
  ctx.font = fontSize + "px monospace";
  for(let i=0;i<drops.length;i++){
    const text = chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(text,i*fontSize,drops[i]*fontSize);
    if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i]=0;
    drops[i]++;
  }
}
setInterval(draw,35);
</script>
