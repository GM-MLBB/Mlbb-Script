<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V3 GM - DAILY KEY</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#0a0a0a;border:3px solid red;border-radius:25px;padding:25px;width:90%;max-width:400px;text-align:center;box-shadow:0 0 30px rgba(255,0,0,.6)}
.title{color:#ff3333;font-weight:900;font-size:26px}
.subtitle{color:#ff0000;font-weight:bold;font-size:18px;margin:10px 0}
.keybox{background:#000;border:2px solid #222;border-bottom:3px solid #00aaff;border-radius:15px;padding:20px;margin:15px 0;font-size:28px;font-weight:900;color:#00ff88;letter-spacing:2px}
.exp{color:#ffeb3b;font-weight:bold;margin:10px 0}
.btn{width:100%;background:linear-gradient(90deg,#ff0000,#cc0000);color:white;border:none;padding:16px;border-radius:12px;font-size:20px;font-weight:900;cursor:pointer}
.footer{margin-top:18px;color:#555;font-size:12px}
</style>
</head>
<body>
<div class="card">
<div class="title">V3 GM - PREMIUM PANEL</div>
<div class="subtitle">• STATUS: KEY ACTIVE TODAY</div>
<div class="keybox" id="key">GM-910-VIP</div>
<div class="exp" id="exp">⏰ Exp in: --j --m • --:--:-- WIB LIVE</div>
<button class="btn" onclick="copyKey()">COPY KEY & OPEN APP</button>
<div class="footer">GM MOD || GOD OF SCRIPT 🇮🇩</div>
</div>
<script>
function updateKey(){
  const now = new Date();
  const wib = new Date(now.toLocaleString("en-US",{timeZone:"Asia/Jakarta"}));
  const d = wib.getDate(); const m = wib.getMonth()+1;
  const key = `GM-${d}${m}-VIP`;
  document.getElementById("key").innerText = key;
  const exp = new Date(wib); exp.setHours(23,59,59,999);
  let diff = exp - wib; if(diff<0) diff=0;
  const h = Math.floor(diff/3600000);
  const mm = Math.floor((diff%3600000)/60000);
  const ss = Math.floor((diff%60000)/1000);
  const timeStr = wib.toLocaleTimeString("id-ID",{hour12:false});
  document.getElementById("exp").innerText = `⏰ Exp in: ${h}j ${mm}m ${ss}d • ${timeStr} WIB LIVE`;
}
function copyKey(){
  const k = document.getElementById("key").innerText;
  navigator.clipboard.writeText(k).then(()=>{alert("✅ Key "+k+" di-copy! Tempel di apk.");});
}
setInterval(updateKey,1000); updateKey();
</script>
</body>
</html>
